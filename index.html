<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reformed Standards - Theological Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400&family=Outfit:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap"
    rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            serif: ['Cormorant Garamond', 'serif'],
            display: ['Cinzel', 'serif'],
            elegant: ['Playfair Display', 'serif'],
          },
          colors: {
            reformed: {
              50: '#FAF6F0',
              100: '#F3EAE0',
              200: '#E6D3C1',
              300: '#D4B89F',
              400: '#C09A7B',
              500: '#AA7C59',
              600: '#8E5F3D',
              700: '#72462A',
              800: '#58321B',
              900: '#412210',
              950: '#261105',
            },
            theology: {
              gold: '#D4AF37',
              crimson: '#9E2A2B',
              ink: '#1D1A16',
            }
          },
          animation: {
            'fade-in-up': 'fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'float-slow': 'floatSlow 6s ease-in-out infinite',
            'pulse-soft': 'pulseSoft 3s ease-in-out infinite',
          },
          keyframes: {
            fadeInUp: {
              '0%': { opacity: '0', transform: 'translateY(15px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
            floatSlow: {
              '0%, 100%': { transform: 'translateY(0px)' },
              '50%': { transform: 'translateY(-8px)' },
            },
            pulseSoft: {
              '0%, 100%': { opacity: '1' },
              '50%': { opacity: '0.85' },
            }
          }
        },
      },
    }
  </script>
  <style>
    body {
      background-color: #FAF6F0;
      color: #261105;
      transition: background-color 0.4s cubic-bezier(0.16, 1, 0.3, 1), color 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dark body {
      background-color: #150A03;
      color: #F3EAE0;
    }

    /* Premium Glassmorphic Cards */
    .glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px) saturate(120%);
      -webkit-backdrop-filter: blur(16px) saturate(120%);
      border: 1px solid rgba(170, 124, 89, 0.15);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .dark .glass-card {
      background: rgba(38, 17, 5, 0.6);
      backdrop-filter: blur(16px) saturate(120%);
      -webkit-backdrop-filter: blur(16px) saturate(120%);
      border: 1px solid rgba(170, 124, 89, 0.1);
    }

    .glass-card:hover {
      background: rgba(255, 255, 255, 0.85);
      border-color: rgba(170, 124, 89, 0.3);
      box-shadow: 0 20px 40px -15px rgba(88, 50, 27, 0.12);
    }

    .dark .glass-card:hover {
      background: rgba(38, 17, 5, 0.8);
      border-color: rgba(214, 184, 159, 0.2);
      box-shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.5);
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: #FAF6F0;
      border-left: 1px solid rgba(170, 124, 89, 0.1);
    }

    .dark ::-webkit-scrollbar-track {
      background: #150A03;
      border-left: 1px solid rgba(170, 124, 89, 0.05);
    }

    ::-webkit-scrollbar-thumb {
      background: #D4B89F;
      border: 2px solid #FAF6F0;
      border-radius: 5px;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #58321B;
      border: 2px solid #150A03;
      border-radius: 5px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #AA7C59;
    }

    .dark ::-webkit-scrollbar-thumb:hover {
      background: #8E5F3D;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>

</head>

<body
  class="antialiased bg-reformed-50 text-reformed-950 dark:bg-reformed-950 dark:text-reformed-100 transition-colors duration-300">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
